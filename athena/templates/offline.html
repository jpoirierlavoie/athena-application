<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Hors ligne — Pallas Athena</title>
  <style>
    /* The URL must byte-match the sw.js PRECACHE entry so cache.match serves
       the font while offline — the one moment this page is visible. */
    @font-face {
      font-family: "Noto Sans";
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url("/static/vendor/noto-sans-v42-latin-wght.woff2") format("woff2");
    }
    body {
      font-family: "Noto Sans", -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #FAFAFA;
      color: #1a1a1a;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 28rem;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0 0 0.75rem;
    }
    p {
      color: #4b5563;
      line-height: 1.6;
      margin: 0 0 1.5rem;
    }
    button {
      /* Buttons don't inherit the body font by default (no preflight here). */
      font-family: inherit;
      background: #4f46e5;
      color: #fff;
      border: none;
      padding: 0.625rem 1.5rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover {
      background: #4338ca;
    }
    /* Dark: the service worker precaches this page once per install, and
       the theme cookie is HttpOnly, so the page cannot know the device's
       « Affichage » choice — it follows the device setting only. The values
       are the dark palette tokens of static/src/app.input.css, as hex;
       tests/test_theme_palette.py holds them equal. */
    @media (prefers-color-scheme: dark) {
      :root {
        --color-canvas: #0b0d11;
        --color-gray-900: #dfe1e5;
        --color-gray-600: #b0b4bc;
        --color-indigo-600: #9ba6f9;
        --color-indigo-700: #b1bcfe;
        --color-white: #15171c;
      }
      body { background: var(--color-canvas); color: var(--color-gray-900); }
      p { color: var(--color-gray-600); }
      button { background: var(--color-indigo-600); color: var(--color-white); }
      button:hover { background: var(--color-indigo-700); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Connexion requise</h1>
    <p>Pallas Athena nécessite une connexion réseau pour accéder à vos dossiers.</p>
    <button id="offline-retry">Réessayer</button>
  </div>
  <script nonce="{{ csp_nonce }}">
    document.getElementById('offline-retry').addEventListener('click', function () { location.reload(); });
  </script>
</body>
</html>
