name: OSV-Scanner

on:
  pull_request:
    branches: [ "main" ]
  merge_group:
    branches: [ "main" ]
  schedule:
    - cron: '40 11 * * 4'
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  scan:
    name: OSV-Scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Blocking: a vulnerability hit fails the check instead of being
      # silently swallowed (SARIF still uploads via if: always()).
      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36  # v2.7.0
        with:
          scan-args: |-
            --config=athena/osv-scanner.toml
            --format=sarif
            --output-file=results.sarif
            --lockfile=athena/requirements.txt

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
          category: osv-scanner
