name: CI

on:
  pull_request:
    branches: [ "main" ]
  merge_group:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  verifier:
    name: verifier
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "athena/requirements*.txt"

      - name: Install locked dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install --require-hashes --no-deps -r athena/requirements.txt
          python -m pip install -r athena/requirements-dev.txt

      - name: Run pytest suite, plugin check, and bytecode verification
        run: |
          cd athena
          python -m pytest tests/ -n auto --dist loadfile -q
          python -m scripts.exporter_plugin_athena --check
          python -m compileall -q -f --invalidation-mode checked-hash -x '/tests/' .
